name: Generate Debug Keystore

# Разовый запуск: Actions → "Generate Debug Keystore" → Run workflow.
# Создаёт ФИКСИРОВАННЫЙ debug-keystore и печатает его SHA-1.
# Кейстор нужно скачать из артефактов, положить в app/debug.keystore
# и закоммитить — тогда все сборки (и локальные, и CI) будут подписаны
# одной подписью, а SHA-1 достаточно один раз вписать в Google Cloud Console.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create pinned debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "Keystore created at app/debug.keystore"

      - name: Print SHA-1 (вписать в Google Cloud Console → OAuth Client ID)
        run: |
          echo "=== ЭТОТ SHA-1 НУЖНО УКАЗАТЬ В GOOGLE CLOUD CONSOLE ==="
          echo "=== Credentials → Create OAuth client ID → Android    ==="
          echo "=== Package name: com.photowallpaper                  ==="
          keytool -list -v -keystore app/debug.keystore -storepass android 2>/dev/null \
            | grep -E "SHA1|SHA-256" || true

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinned-debug-keystore
          path: app/debug.keystore
